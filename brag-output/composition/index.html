<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&family=Barlow:wght@500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050607; }
      :root { --accent: #ff5a1f; --ink: #f3f2ef; --display: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Barlow', sans-serif; }
      #root { position: relative; width: 1920px; height: 1080px; background: #050607; color: var(--ink); font-family: var(--body); overflow: hidden; }
      .scene { position: absolute; inset: 0; overflow: hidden; background: #050607; }
      .bg { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; transform-origin: 50% 50%; }
      .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 60%, rgba(0,0,0,.55)); }
      .display { font-family: var(--display); font-style: italic; font-weight: 800; letter-spacing: -0.01em; line-height: .9; text-transform: uppercase; }
      .accent { color: var(--accent); }
      #hook { display: grid; place-items: center; }
      #hook .line { font-size: 150px; text-align: center; white-space: nowrap; }
      #hook .cursor { display: inline-block; width: 14px; height: 120px; background: var(--accent); margin-left: 12px; vertical-align: -10px; }
      .cap { position: absolute; font-family: var(--display); font-style: italic; font-weight: 700; text-transform: uppercase; background: rgba(5,6,7,.78); border-left: 8px solid var(--accent); padding: 14px 30px 14px 26px; }
      #cap2 { left: 96px; bottom: 150px; font-size: 56px; }
      #cap3a { left: 96px; top: 190px; font-size: 120px; }
      #cap3b { left: 96px; top: 340px; font-size: 56px; }
      #cap4 { right: 96px; top: 96px; font-size: 56px; }
      #speed { position: absolute; right: 120px; bottom: 150px; text-align: right; }
      #speed .n { font-size: 260px; }
      #speed .u { font-family: var(--body); font-weight: 600; font-size: 34px; letter-spacing: .4em; color: var(--accent); }
      #s5 { background: transparent; }
      #outro { display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, #15161a 0%, #050607 72%); }
      #outro .stack { text-align: center; }
      #outro .l1 { font-size: 190px; }
      #outro .l2 { font-family: var(--display); font-weight: 600; font-size: 44px; letter-spacing: .62em; color: var(--accent); margin-top: 22px; padding-left: .62em; }
      #outro .tag { font-size: 96px; margin-top: 70px; }
      #outro .modes { font-family: var(--body); font-weight: 600; font-size: 34px; letter-spacing: .3em; color: rgba(243,242,239,.78); margin-top: 36px; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21" data-width="1920" data-height="1080">

      <!-- Scene 1: hook -->
      <div id="hook" class="scene clip" data-start="0" data-duration="2.7" data-track-index="0">
        <div class="line display"><span id="typed"></span><span class="cursor"></span></div>
      </div>

      <!-- Scene 2: reveal -->
      <div id="s2" class="scene clip" data-start="2.7" data-duration="3.5" data-track-index="0">
        <img id="img2" class="bg" src="assets/img/01-menu.png" />
        <div class="shade"></div>
        <div id="cap2" class="cap">Ported from the original Java</div>
      </div>

      <!-- Scene 3: garage -->
      <div id="s3" class="scene clip" data-start="6.2" data-duration="4.0" data-track-index="0">
        <img id="img3" class="bg" src="assets/img/02-cars.png" />
        <div class="shade"></div>
        <div id="cap3a" class="cap">52 cars</div>
        <div id="cap3b" class="cap">+ community cars</div>
      </div>

      <!-- Scene 4: stage -->
      <div id="s4" class="scene clip" data-start="10.2" data-duration="3.2" data-track-index="0">
        <img id="img4" class="bg" src="assets/img/03-stages.png" />
        <div class="shade"></div>
        <div id="cap4" class="cap">Pick a stage. Pick a fight.</div>
      </div>

      <!-- Scene 5: race -->
      <video id="vid5" class="bg" src="assets/race.mp4" data-start="13.4" data-duration="2.27" data-track-index="1" muted playsinline></video>
      <div id="s5" class="scene clip" data-start="13.4" data-duration="4.2" data-track-index="0">
        <img id="img5" class="bg" src="assets/img/race-last.jpg" />
        <div class="shade"></div>
      </div>

      <!-- Scene 6: outro -->
      <div id="outro" class="scene clip" data-start="17.6" data-duration="3.4" data-track-index="0">
        <div class="stack">
          <div class="l1 display">Need for Madness</div>
          <div class="l2">REMASTERED</div>
          <div class="tag display accent" id="tag">Rebuilt. Still mad.</div>
          <div class="modes" id="modes">CAREER · FREE PLAY · ONLINE</div>
        </div>
      </div>

      <div id="flash"></div>

      <audio id="music" src="assets/music/bed.mp3" data-start="0" data-duration="21" data-track-index="5" data-volume="0.55" data-fade-out="1.5"></audio>
      <audio id="hit1" src="assets/sfx/hit.ogg" data-start="2.7" data-duration="0.5" data-track-index="6" data-volume="0.9"></audio>
      <audio id="hit2" src="assets/sfx/hit.ogg" data-start="17.6" data-duration="0.5" data-track-index="7" data-volume="0.9"></audio>
      <audio id="tk1" src="assets/sfx/tick.ogg" data-start="6.7" data-duration="0.3" data-track-index="8" data-volume="0.8"></audio>
      <audio id="tk2" src="assets/sfx/tick.ogg" data-start="7.8" data-duration="0.3" data-track-index="9" data-volume="0.8"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Scene 1: typed hook (deterministic: driven by a progress value)
      const text = "Remember Need for Madness?";
      const typed = document.getElementById("typed");
      const st = { p: 0 };
      tl.to(st, { p: text.length, duration: 1.3, ease: "none", onUpdate: () => { typed.textContent = text.slice(0, Math.round(st.p)); } }, 0.2);
      tl.set(typed, { textContent: text }, 1.6);
      tl.fromTo(".cursor", { opacity: 1 }, { opacity: 0, duration: 0.12, repeat: 3, yoyo: true }, 1.5);

      // Scene 2: slam-in + slow push
      tl.fromTo("#img2", { scale: 1.12 }, { scale: 1.0, duration: 3.5, ease: "power2.out" }, 2.7);
      tl.fromTo("#cap2", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 4.2);

      // Scene 3: counters arrive one by one
      tl.fromTo("#img3", { scale: 1.0, x: 0 }, { scale: 1.04, duration: 4.0, ease: "none" }, 6.2);
      tl.fromTo("#cap3a", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 6.7);
      tl.fromTo("#cap3b", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 7.8);

      // Scene 4: stage push-in
      tl.fromTo("#img4", { scale: 1.0 }, { scale: 1.05, transformOrigin: "0% 100%", duration: 3.2, ease: "power1.inOut" }, 10.2);
      tl.fromTo("#cap4", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 10.8);

      // Scene 5: race footage, then hold on last frame with a push-in
      tl.set("#img5", { opacity: 0 }, 13.4);
      tl.set("#img5", { opacity: 1 }, 15.67);
      tl.fromTo("#img5", { scale: 1.0 }, { scale: 1.04, duration: 1.93, ease: "power1.out" }, 15.67);

      // flash into the outro on the strong beat
      tl.set("#flash", { opacity: 0 }, 0);
      tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 17.6);

      // Scene 6: outro
      tl.fromTo(".l1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 17.7);
      tl.fromTo(".l2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 18.1);
      tl.fromTo("#tag", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 18.8);
      tl.fromTo("#modes", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 19.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
